<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 가이드 · 도시 선택</title>
  <link rel="stylesheet" href="assets/city-select.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">Travel Guide</p>
    <h1>여행지를 선택하세요</h1>
    <p>도시별 일정은 서로 다른 주소에서 엽니다.</p>
    <nav class="destinations" aria-label="여행지">
      <a class="destination" href="Paris/">
        <strong>Paris</strong>
        <span>현재 파리 일정 열기 →</span>
      </a>
      <a class="destination" href="Kumamoto/">
        <strong>Kumamoto</strong>
        <span>준비 중인 페이지 보기 →</span>
      </a>
    </nav>
  </main>
</body>
</html>
